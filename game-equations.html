<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equations Game | Omar Khaled</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-page-container {
            max-width: 680px;
            margin: 0 auto;
            padding: 110px 20px 80px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-title-box {
            text-align: center;
            margin-bottom: 34px;
            width: 100%;
        }

        .game-title-box h1 {
            font-size: 2.4rem;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .progress-bar-wrap {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 8px;
            margin: 14px 0 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #ff9900);
            border-radius: 8px;
            transition: width 0.4s ease;
        }

        .progress-label {
            font-size: 0.95rem;
            color: #888;
            text-align: right;
            width: 100%;
            margin-bottom: 18px;
        }

        /* Question Card */
        .eq-card {
            width: 100%;
            background: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 18px;
            padding: 32px 36px;
            margin-bottom: 28px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        [data-theme="dark"] .eq-card {
            box-shadow: 0 8px 24px rgba(255,215,0,0.06);
        }

        .eq-number {
            font-size: 0.95rem;
            color: var(--accent-color);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 18px;
        }

        .eq-text {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.8;
            font-family: 'Courier New', monospace;
            color: var(--text-color);
            white-space: pre-line;
        }

        .eq-ask {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent-color);
            margin-top: 14px;
        }

        /* Answer Choices */
        .choices-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            margin-bottom: 28px;
        }

        .choice-btn {
            width: 100%;
            padding: 16px 24px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            text-align: left;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
            letter-spacing: 0.3px;
        }

        .choice-btn:hover:not(:disabled) {
            border-color: var(--accent-color);
            background: rgba(212,175,55,0.08);
            transform: translateX(6px);
        }

        .choice-btn.correct {
            border-color: #4caf50;
            background: rgba(76,175,80,0.12);
            color: #4caf50;
        }

        .choice-btn.wrong {
            border-color: #ef5350;
            background: rgba(239,83,80,0.1);
            color: #ef5350;
        }

        .choice-btn:disabled { cursor: default; }

        /* Buttons */
        .game-btns {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gbtn {
            padding: 13px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }

        .gbtn:hover { transform: translateY(-2px); opacity: 0.9; }
        .gbtn-reset { background: var(--accent-color); color: #111; }
        .gbtn-exit { background: #555; color: #fff; }
        [data-theme="dark"] .gbtn-exit { background: #333; }

        /* Modal */
        .result-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.82);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .result-overlay.show { display: flex; }

        .result-box {
            background: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 20px;
            padding: 44px 50px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: slideUp 0.28s ease;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .result-emoji { font-size: 3.5rem; margin-bottom: 14px; }
        .result-msg { font-size: 1.5rem; font-weight: 800; color: var(--accent-color); margin-bottom: 8px; }
        .result-sub { font-size: 1rem; color: #888; margin-bottom: 28px; }
        .result-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

        .rbtn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .rbtn:hover { transform: translateY(-2px); }
        .rbtn-yes { background: var(--accent-color); color: #111; }
        .rbtn-no { background: #555; color: #fff; }
        [data-theme="dark"] .rbtn-no { background: #333; }

        /* Score */
        .score-badge {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-color);
            background: rgba(212,175,55,0.12);
            border: 1px solid var(--accent-color);
            border-radius: 30px;
            padding: 6px 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .game-page-container { padding-top: 28px; }
            .game-title-box h1 { font-size: 1.8rem; }
            .eq-card { padding: 22px 18px; }
            .eq-text { font-size: 1.1rem; }
            .result-box { padding: 28px 20px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-left">
            <div class="profile-frame" id="profile-trigger">
                <img src="assets/2.jpeg" alt="Omar Khaled" class="profile-img">
            </div>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About Me</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="resume.html">Resume</a>
                <a href="games.html">Games</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
        <div class="nav-right">
            <div class="toggle-container">
                <span class="toggle-label">Dark Mode</span>
                <button id="theme-toggle" class="switch-btn"></button>
            </div>
            <button class="subscribe-btn">Subscribe</button>
        </div>
    </header>

    <div id="image-modal" class="modal">
        <span class="close-modal" id="close-modal">&times;</span>
        <img class="modal-content" src="assets/2.jpeg" alt="Omar Khaled Enlarged">
    </div>

    <!-- Result Modal -->
    <div class="result-overlay" id="result-overlay">
        <div class="result-box">
            <div class="result-emoji" id="result-emoji"></div>
            <div class="result-msg" id="result-msg"></div>
            <div class="result-sub" id="result-sub">Play again?</div>
            <div class="result-btns">
                <button class="rbtn rbtn-yes" id="rbtn-yes">Yes ✓</button>
                <button class="rbtn rbtn-no" id="rbtn-no">No ✗</button>
            </div>
        </div>
    </div>

    <main class="game-page-container">
        <div class="game-title-box">
            <h1>𝑥 First-Degree Equations</h1>
        </div>

        <div class="score-badge" id="score-badge">Score: 0 / 0</div>

        <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div class="progress-label" id="progress-label">Question 1 of 100</div>

        <div class="eq-card">
            <div class="eq-number" id="eq-number">QUESTION 1</div>
            <div class="eq-text" id="eq-text"></div>
            <div class="eq-ask">Find X = ?</div>
        </div>

        <div class="choices-grid" id="choices-grid">
            <button class="choice-btn" data-idx="0"></button>
            <button class="choice-btn" data-idx="1"></button>
            <button class="choice-btn" data-idx="2"></button>
        </div>

        <div class="game-btns">
            <button class="gbtn gbtn-reset" id="btn-reset">↺ Restart</button>
            <button class="gbtn gbtn-exit" id="btn-exit">✕ Exit</button>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        // ──────────────────────────────────────
        // 100 first-degree equation questions
        // Each: { lines: string[], answer: number }
        // ──────────────────────────────────────
        function generateQuestions() {
            const qs = [];
            // Pattern 1: aX + b = c  → X = (c-b)/a
            const pairs1 = [
                [2,4,10],[3,1,10],[5,0,25],[4,8,20],[6,3,21],[1,7,12],[3,6,15],[2,9,19],[7,0,28],[4,3,19],
                [5,5,30],[2,2,8],[3,9,18],[6,6,24],[1,4,9],[8,0,24],[2,7,13],[4,1,13],[3,3,12],[5,10,30],
                [2,6,14],[3,0,9],[4,4,20],[6,2,20],[1,8,11],[7,7,28],[2,1,7],[5,3,23],[3,7,22],[4,6,18],
            ];
            for (const [a,b,c] of pairs1) {
                const X = (c - b) / a;
                if (!Number.isInteger(X)) continue;
                qs.push({ lines: [`${a}X + ${b} = ${c}`], answer: X });
            }

            // Pattern 2: aX = b, find X
            const pairs2 = [
                [3,12],[4,20],[5,35],[6,18],[7,49],[2,16],[8,40],[9,27],[10,50],[3,21],
                [4,28],[5,15],[6,30],[7,14],[2,18],[8,56],[9,63],[3,27],[4,36],[5,45],
            ];
            for (const [a,b] of pairs2) {
                qs.push({ lines: [`${a}X = ${b}`], answer: b/a });
            }

            // Pattern 3: two-step  aX + bY = c, Y = d, find X
            const triplets = [
                [1,4,8,2],[2,3,12,2],[1,2,10,3],[3,1,9,3],[2,5,20,2],[1,3,15,4],[4,2,16,2],[1,6,12,1],
                [2,4,18,2],[3,3,15,2],[1,5,10,1],[2,2,14,3],[3,4,20,2],[1,7,14,1],[2,6,22,2],
                [4,3,19,1],[1,8,16,1],[2,7,21,1],[3,5,20,2],[1,9,18,1],
            ];
            for (const [a,b,c,y] of triplets) {
                // aX + b*y = c  => X = (c - b*y)/a
                const X = (c - b * y) / a;
                if (!Number.isInteger(X) || X < 0) continue;
                qs.push({
                    lines: [`${a}X + ${b}Y = ${c}`, `${b}Y = ${b * y}`, `X = ?`],
                    answer: X
                });
            }

            // shuffle & cap to 100
            for (let i = qs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [qs[i], qs[j]] = [qs[j], qs[i]];
            }
            return qs.slice(0, 100);
        }

        let questions = [];
        let order = [];
        let currentIdx = 0;
        let score = 0;
        let answered = 0;
        let answered_current = false;

        const eqText = document.getElementById('eq-text');
        const eqNumber = document.getElementById('eq-number');
        const choiceBtns = document.querySelectorAll('.choice-btn');
        const progressFill = document.getElementById('progress-fill');
        const progressLabel = document.getElementById('progress-label');
        const scoreBadge = document.getElementById('score-badge');
        const overlay = document.getElementById('result-overlay');

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function generateChoices(correct) {
            const offsets = shuffle([-3,-2,-1,1,2,3,4,5,-4,-5]);
            const wrongs = new Set();
            for (const o of offsets) {
                const w = correct + o;
                if (w !== correct && w >= 0) wrongs.add(w);
                if (wrongs.size === 2) break;
            }
            const choices = [correct, ...Array.from(wrongs)];
            return shuffle(choices);
        }

        function loadQuestion() {
            answered_current = false;
            const qi = order[currentIdx];
            const q = questions[qi];

            eqNumber.textContent = `QUESTION ${currentIdx + 1}`;
            eqText.textContent = q.lines.join('\n');
            progressLabel.textContent = `Question ${currentIdx + 1} of ${questions.length}`;
            progressFill.style.width = `${((currentIdx) / questions.length) * 100}%`;
            scoreBadge.textContent = `Score: ${score} / ${answered}`;

            const choices = generateChoices(q.answer);
            choiceBtns.forEach((btn, i) => {
                btn.textContent = `X = ${choices[i]}`;
                btn.dataset.value = choices[i];
                btn.className = 'choice-btn';
                btn.disabled = false;
            });
        }

        function showResult(emoji, msg, sub) {
            document.getElementById('result-emoji').textContent = emoji;
            document.getElementById('result-msg').textContent = msg;
            document.getElementById('result-sub').textContent = sub || 'Play again?';
            overlay.classList.add('show');
        }

        choiceBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (answered_current) return;
                answered_current = true;
                answered++;

                const qi = order[currentIdx];
                const correct = questions[qi].answer;
                const chosen = parseInt(btn.dataset.value);

                choiceBtns.forEach(b => {
                    b.disabled = true;
                    if (parseInt(b.dataset.value) === correct) b.classList.add('correct');
                });

                if (chosen === correct) {
                    score++;
                    scoreBadge.textContent = `Score: ${score} / ${answered}`;
                    setTimeout(() => {
                        currentIdx++;
                        if (currentIdx >= questions.length) {
                            progressFill.style.width = '100%';
                            showResult('🎉', `You completed all ${questions.length} questions!`, `Final Score: ${score} / ${questions.length}`);
                        } else {
                            loadQuestion();
                        }
                    }, 700);
                } else {
                    btn.classList.add('wrong');
                    scoreBadge.textContent = `Score: ${score} / ${answered}`;
                    setTimeout(() => {
                        showResult('❌', 'Wrong Answer!', 'Try again from the beginning?');
                    }, 700);
                }
            });
        });

        function startGame() {
            questions = generateQuestions();
            order = shuffle([...Array(questions.length).keys()]);
            currentIdx = 0;
            score = 0;
            answered = 0;
            overlay.classList.remove('show');
            loadQuestion();
        }

        document.getElementById('btn-reset').addEventListener('click', startGame);
        document.getElementById('btn-exit').addEventListener('click', () => { window.location.href = 'games.html'; });
        document.getElementById('rbtn-yes').addEventListener('click', startGame);
        document.getElementById('rbtn-no').addEventListener('click', () => { window.location.href = 'games.html'; });

        // Init
        startGame();
    </script>
</body>
</html>
